services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: txn_intel
      POSTGRES_USER: txn
      POSTGRES_PASSWORD: txn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn -d txn_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/data/models
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
